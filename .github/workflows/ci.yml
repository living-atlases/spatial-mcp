name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # nightly: catch drift of the public spatial-service API against the reference version
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  public-api:
    # Anonymous checks against the LA demo stack: published OpenAPI spec vs the reference, public reads,
    # admin endpoints refusing anonymous callers. Admin (write) tests run on Jenkins, next to the stack.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The demo stack is redeployed from time to time: skip, rather than fail, while it is down.
      - id: lademo
        run: |
          if curl -fsS -m 30 https://spatial.l-a.site/ws/fields | node -e 'if (!Array.isArray(JSON.parse(require("fs").readFileSync(0, "utf8")))) process.exit(1)'; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice::spatial.l-a.site is not available: integration tests skipped"
          fi
      - if: steps.lademo.outputs.up == 'true'
        run: npm run test:integration
        env:
          SPATIAL_TEST_URL: https://spatial.l-a.site/ws
